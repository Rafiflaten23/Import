<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   DESIGN TOKENS — "Sunny Ledger" theme
   Adapted from a cream/amber/sky-blue portfolio aesthetic:
   warm paper background, rounded panels, Poppins headings,
   Baloo 2 brand mark, soft dashed dividers instead of hard
   terminal borders. Amber = primary flow, sky blue = secondary,
   coral = decline, mint = positive delta.
   ============================================================ */
:root{
  --bg:#FBF6EB; --bg-1:#F6F1E3; --panel:#FFFFFF; --panel-2:#F3EEE0;
  --border:#E4DCC8; --border-soft:#ECE5D3;
  --text:#1C2340; --text-dim:#5B6478; --text-faint:#96A0AD;
  --accent:#2547E0;      /* amber-blue — primary flow / positive */
  --accent-2:#6FA3EE;    /* sky — secondary series */
  --amber:#F5A524;       /* highlight / forecast */
  --coral:#F0654B;       /* decline / alert */
  --violet:#9B7EDE;
  --mint:#2FBF8F;
  --font-display:'Poppins', sans-serif;
  --font-brand:'Baloo 2', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'Poppins', sans-serif;
  --radius:20px; --radius-sm:12px;
  --shadow: 0 10px 30px -12px rgba(28,35,64,0.14);
}
[data-theme="light"]{
  --bg:#FBF6EB; --bg-1:#F6F1E3; --panel:#FFFFFF; --panel-2:#F3EEE0;
  --border:#E4DCC8; --border-soft:#ECE5D3;
  --text:#1C2340; --text-dim:#5B6478; --text-faint:#96A0AD;
}
[data-theme="dark"]{
  --bg:#171B2E; --bg-1:#1D2238; --panel:#232945; --panel-2:#1D2238;
  --border:#343B5C; --border-soft:#2A3050;
  --text:#F3F1E8; --text-dim:#AEB4CC; --text-faint:#767CA0;
  --shadow: 0 10px 30px -12px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.up{color:var(--mint);} .down{color:var(--coral);}

/* ---------- App shell ---------- */
#app{max-width:1720px; margin:0 auto; padding:0 20px 60px;}

.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; margin:0 -20px 16px;
  background:linear-gradient(180deg, var(--bg) 82%, transparent);
  backdrop-filter: blur(6px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex; align-items:center; gap:10px; margin-right:8px;}
.brand-mark{
  width:34px; height:34px; border-radius:12px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-brand); font-weight:700; color:#fff; font-size:15px;
  flex:none; box-shadow:var(--shadow);
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-text b{font-family:var(--font-brand); font-size:16px; letter-spacing:0.2px;}
.brand-text span{font-size:10.5px; color:var(--text-faint); letter-spacing:.4px; text-transform:uppercase;}

.status-pill{
  display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:20px; border:1px solid var(--border);
  background:var(--panel); font-size:11px; color:var(--text-dim); white-space:nowrap;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
.status-dot.live{background:var(--mint); box-shadow:0 0 0 3px rgba(47,191,143,0.18);}
.status-dot.demo{background:var(--amber); box-shadow:0 0 0 3px rgba(245,165,36,0.18);}

.search-box{
  flex:1; display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:9px 14px; min-width:160px; max-width:420px;
}
.search-box input{
  border:none; background:transparent; outline:none; color:var(--text);
  font-size:12.5px; width:100%; font-family:var(--font-body);
}
.search-box svg{flex:none; opacity:.5;}

.topbar-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
.icon-btn{
  width:36px; height:36px; border-radius:12px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  transition:.15s;
}
.icon-btn:hover{color:var(--accent); border-color:var(--accent);}
.btn{
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  padding:9px 16px; border-radius:14px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:6px; transition:.15s;
}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{filter:brightness(1.08); color:#fff;}
.btn.ghost{background:transparent;}

/* ---------- Source / connect panel ---------- */
.connect-banner{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 18px; margin-bottom:16px; box-shadow:var(--shadow);
}
.connect-banner.live{border-color:rgba(47,191,143,0.4); background:linear-gradient(0deg, rgba(47,191,143,0.06), rgba(47,191,143,0.06)), var(--panel);}
.connect-banner .msg{flex:1; min-width:220px; font-size:12px; color:var(--text-dim);}
.connect-banner .msg b{color:var(--text);}
.connect-form{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.connect-form input{
  background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
  padding:8px 10px; color:var(--text); font-size:12px; font-family:var(--font-mono);
  width:230px;
}
.connect-form input:focus{outline:none; border-color:var(--accent);}

/* ---------- Filter bar ---------- */
.filterbar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; margin-bottom:18px; box-shadow:var(--shadow);
}
.filterbar .flabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-right:2px;}
.filterbar select, .filterbar .range-mini{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:7px 10px; font-size:12px; font-family:var(--font-body);
  min-width:110px;
}
.filterbar select:focus{outline:none; border-color:var(--accent);}
.chip{
  display:flex; align-items:center; gap:6px;
  background:rgba(37,71,224,0.10); border:1px solid rgba(37,71,224,0.3);
  color:var(--accent); padding:5px 10px; border-radius:20px; font-size:11.5px; font-weight:600;
}
.chip button{background:none;border:none;color:inherit;font-size:13px;line-height:1;padding:0;}
.reset-link{font-size:11.5px; color:var(--text-faint); text-decoration:underline; margin-left:auto; background:none; border:none;}
.reset-link:hover{color:var(--coral);}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); overflow-x:auto;}
.tab{
  padding:10px 16px; font-size:12.5px; font-weight:600; color:var(--text-faint);
  border-bottom:2px solid transparent; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none;
}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}

/* ---------- KPI grid ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; margin-bottom:18px;}
@media(max-width:1400px){.kpi-grid{grid-template-columns:repeat(3, 1fr);}}
@media(max-width:760px){.kpi-grid{grid-template-columns:repeat(2, 1fr);}}
.kpi{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.kpi::before{
  content:''; position:absolute; top:0; left:0; width:4px; height:100%;
  background:var(--kpi-accent, var(--accent)); opacity:.85; border-radius:0 4px 4px 0;
}
.kpi .lbl{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
.kpi .val{font-family:var(--font-mono); font-size:21px; font-weight:600; letter-spacing:-.3px;}
.kpi .sub{display:flex; align-items:center; gap:5px; margin-top:6px; font-size:11px; color:var(--text-dim);}

/* ---------- Panels / cards ---------- */
.grid{display:grid; gap:14px;}
.grid.cols-3{grid-template-columns:2fr 1fr 1fr;}
.grid.cols-2{grid-template-columns:1.3fr 1fr;}
.grid.cols-2b{grid-template-columns:1fr 1fr;}
@media(max-width:1100px){.grid.cols-3,.grid.cols-2,.grid.cols-2b{grid-template-columns:1fr;}}

.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.card-title{font-family:var(--font-display); font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px;}
.card-title .badge{
  font-family:var(--font-body); font-size:9.5px; font-weight:700; letter-spacing:.4px;
  padding:2px 8px; border-radius:10px; background:rgba(37,71,224,0.12); color:var(--accent); text-transform:uppercase;
}
.card-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}
.seg{display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:2px; gap:2px;}
.seg button{background:none; border:none; color:var(--text-dim); font-size:11px; padding:6px 11px; border-radius:9px; font-weight:600;}
.seg button.active{background:var(--accent); color:#fff;}
.toggle-row{display:flex; gap:6px; flex-wrap:wrap;}
.mini-toggle{
  display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim);
  border:1px solid var(--border); padding:6px 10px; border-radius:10px; background:var(--panel-2);
}
.mini-toggle input{accent-color:var(--accent);}

.chart-box{width:100%;}
.h-260{height:260px;} .h-320{height:320px;} .h-380{height:380px;} .h-440{height:440px;} .h-520{height:520px;}

/* ---------- Insight panel ---------- */
.insight-list{display:flex; flex-direction:column; gap:8px;}
.insight-item{
  display:flex; gap:10px; align-items:flex-start; padding:11px 13px;
  background:var(--panel-2); border:1px solid var(--border-soft); border-radius:14px; font-size:12px;
}
.insight-item .dot{width:6px;height:6px;border-radius:50%;margin-top:5px; flex:none;}
.insight-item b{color:var(--text);}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto; border:1px solid var(--border-soft); border-radius:14px;}
table{width:100%; border-collapse:collapse; font-size:12px;}
thead th{
  position:sticky; top:0; background:var(--panel-2); text-align:left; padding:10px 12px;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint);
  border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none;
}
thead th:hover{color:var(--accent);}
thead th .arrow{opacity:.4; margin-left:4px;}
tbody td{padding:9px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap; font-family:var(--font-mono);}
tbody td.txt{font-family:var(--font-body); white-space:normal;}
tbody tr:hover{background:var(--panel-2);}
tbody tr{cursor:pointer;}
.rank-badge{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:6px; background:var(--panel-2); font-size:10.5px; font-weight:700; color:var(--text-dim); margin-right:6px;
}
.pagination{display:flex; align-items:center; justify-content:space-between; padding:10px 4px 0; font-size:11.5px; color:var(--text-dim);}
.pagination .pgbtns{display:flex; gap:4px;}
.pagination button{
  border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim);
  width:28px; height:28px; border-radius:9px; font-size:11px;
}
.pagination button:disabled{opacity:.35; cursor:default;}
.pagination button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

/* ---------- Unavailable module notice ---------- */
.unavail{
  border:1px dashed var(--border); border-radius:var(--radius); padding:24px;
  text-align:center; color:var(--text-dim); background:repeating-linear-gradient(135deg, var(--panel), var(--panel) 10px, var(--panel-2) 10px, var(--panel-2) 20px);
}
.unavail b{color:var(--amber); display:block; font-size:13px; margin-bottom:6px; font-family:var(--font-display);}
.unavail .fine{font-size:11.5px; color:var(--text-faint); margin-top:8px; max-width:560px; margin-left:auto; margin-right:auto;}

/* ---------- Map ---------- */
.map-legend{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-dim);}
.legend-scale{width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg, #F3EEE0, var(--accent));}

/* ---------- Footer ---------- */
.footer{margin-top:30px; padding-top:16px; border-top:1px solid var(--border-soft); font-size:11px; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ---------- Loading skeleton ---------- */
.skel{background:linear-gradient(90deg, var(--panel-2) 25%, var(--border-soft) 37%, var(--panel-2) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:14px;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.hidden{display:none !important;}
.grow{flex:1;}
.text-right{text-align:right;}
</style>
</head>

<script>
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function buildFactTable() {
  const rows = [];
  let idCounter = 1;
  const hsDesc = RAW_IMPORT_DATA.hsDesc;
  const portProvince = RAW_IMPORT_DATA.portProvince;

  RAW_IMPORT_DATA.records.forEach(([hsCode, year, month, port, valueUSD]) => {
    // Implied volume/shipment metrics are not published at this HS2 x port
    // granularity by BPS; we do not fabricate them. Only value (USD) is real.
    rows.push({
      id: idCounter++,
      year, month,
      quarter: Math.ceil(month / 3),
      country: 'China',
      hsCode,
      hsDesc: hsDesc[hsCode] || '',
      category: `[${hsCode}] ${(hsDesc[hsCode] || '').split(';')[0]}`,
      port,
      province: portProvince[port] || '',
      valueUSD: Math.round(valueUSD),
    });
  });

  let latestPeriod = { year: 2021, month: 1 };
  rows.forEach(r => {
    if (r.year > latestPeriod.year || (r.year === latestPeriod.year && r.month > latestPeriod.month)) {
      latestPeriod = { year: r.year, month: r.month };
    }
  });

  return { rows, latestPeriod };
}

// ---- Aggregation helpers ----
function sum(arr, fn) { return arr.reduce((a, r) => a + fn(r), 0); }

function aggregateBy(rows, keyFn) {
  const map = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!map.has(k)) map.set(k, { key: k, valueUSD: 0, count: 0 });
    const e = map.get(k);
    e.valueUSD += r.valueUSD; e.count++;
  }
  return Array.from(map.values());
}

function monthKey(r) { return `${r.year}-${String(r.month).padStart(2, '0')}`; }

<script>
// ============================================================
// APP — Indonesia Import Intelligence
// ============================================================
(function () {
  'use strict';

  // ---------------- Global state ----------------
  const State = {
    theme: 'light',
    allRows: [],
    latestPeriod: null,
    activeTab: 'overview',
    filters: {
      yearFrom: 2021, yearTo: null, month: 'all', quarter: 'all',
      hsGroup: 'all', port: 'all', hsCode: 'all', search: '',
    },
    trendGranularity: 'monthly',
    showMA: true, showForecast: false, forecastHorizon: 6,
    tableSort: { key: 'valueUSD', dir: 'desc' },
    tablePage: 1, tablePageSize: 12,
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const fmtUSD = (v, compact) => {
    if (v == null || isNaN(v)) return '—';
    if (compact) {
      const abs = Math.abs(v);
      if (abs >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
      if (abs >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
      if (abs >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
      return '$' + v.toFixed(0);
    }
    return '$' + Math.round(v).toLocaleString('en-US');
  };
  const fmtNum = (v) => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString('en-US');
  const fmtPct = (v, withSign) => {
    if (v == null || isNaN(v) || !isFinite(v)) return '—';
    const s = (withSign && v > 0 ? '+' : '') + v.toFixed(1) + '%';
    return s;
  };

  // ---------------- Filtering ----------------
  function applyFilters(rows) {
    const f = State.filters;
    return rows.filter(r => {
      if (r.year < f.yearFrom || r.year > f.yearTo) return false;
      if (f.month !== 'all' && r.month !== Number(f.month)) return false;
      if (f.quarter !== 'all' && r.quarter !== Number(f.quarter)) return false;
      if (f.port !== 'all' && r.port !== f.port) return false;
      if (f.hsCode !== 'all' && r.hsCode !== f.hsCode) return false;
      if (f.search) {
        const s = f.search.toLowerCase();
        const hay = `${r.hsCode} ${r.hsDesc} ${r.port} ${r.province}`.toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }

  function getFilteredRows() { return applyFilters(State.allRows); }

  function dimFilteredRows() {
    const f = State.filters;
    return State.allRows.filter(r => {
      if (f.port !== 'all' && r.port !== f.port) return false;
      if (f.hsCode !== 'all' && r.hsCode !== f.hsCode) return false;
      if (f.search) {
        const s = f.search.toLowerCase();
        const hay = `${r.hsCode} ${r.hsDesc} ${r.port} ${r.province}`.toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }

  function monthKeyNum(y, m) { return y * 100 + m; }

  function computeKPIs() {
    const rows = getFilteredRows();
    const gRows = dimFilteredRows();
    const totalValue = rows.reduce((a, r) => a + r.valueUSD, 0);
    const ports = new Set(rows.map(r => r.port)).size;
    const hsCodes = new Set(rows.map(r => r.hsCode)).size;
    const monthSet = new Set(rows.map(r => monthKeyNum(r.year, r.month)));
    const avgMonthly = monthSet.size ? totalValue / monthSet.size : 0;

    const monthTotals = new Map();
    gRows.forEach(r => {
      const k = monthKeyNum(r.year, r.month);
      monthTotals.set(k, (monthTotals.get(k) || 0) + r.valueUSD);
    });
    const sortedMonths = Array.from(monthTotals.keys()).sort((a, b) => a - b);
    const lastK = sortedMonths[sortedMonths.length - 1];
    const lastY = Math.floor(lastK / 100), lastM = lastK % 100;
    const prevK = lastM === 1 ? (lastY - 1) * 100 + 12 : lastY * 100 + (lastM - 1);
    const yoyK = (lastY - 1) * 100 + lastM;
    const lastVal = monthTotals.get(lastK) || 0;
    const prevVal = monthTotals.get(prevK);
    const yoyVal = monthTotals.get(yoyK);
    const mom = prevVal ? ((lastVal - prevVal) / prevVal) * 100 : null;
    const yoy = yoyVal ? ((lastVal - yoyVal) / yoyVal) * 100 : null;

    const yearsInRange = Array.from(new Set(rows.map(r => r.year))).sort((a, b) => a - b);
    let cagr = null;
    if (yearsInRange.length >= 2) {
      const y0 = yearsInRange[0], y1 = yearsInRange[yearsInRange.length - 1];
      const v0 = rows.filter(r => r.year === y0).reduce((a, r) => a + r.valueUSD, 0);
      const v1 = rows.filter(r => r.year === y1).reduce((a, r) => a + r.valueUSD, 0);
      const n = y1 - y0;
      if (v0 > 0 && n > 0) cagr = (Math.pow(v1 / v0, 1 / n) - 1) * 100;
    }

    return {
      totalValue, ports, hsCodes,
      avgMonthly, mom, yoy, cagr,
      lastPeriodLabel: lastM ? `${MONTH_NAMES[lastM - 1]} ${lastY}` : '—',
    };
  }

  function buildTrendSeries(granularity) {
    const rows = getFilteredRows();
    const map = new Map();
    rows.forEach(r => {
      let key;
      if (granularity === 'yearly') key = String(r.year);
      else if (granularity === 'quarterly') key = `${r.year}-Q${r.quarter}`;
      else key = `${r.year}-${String(r.month).padStart(2, '0')}`;
      if (!map.has(key)) map.set(key, { key, value: 0, sortKey: r.year * 100 + (granularity === 'quarterly' ? r.quarter : r.month) });
      const e = map.get(key);
      e.value += r.valueUSD;
    });
    const arr = Array.from(map.values()).sort((a, b) => a.sortKey - b.sortKey);
    return arr;
  }

  function movingAverage(arr, key, window) {
    return arr.map((_, i) => {
      const start = Math.max(0, i - window + 1);
      const slice = arr.slice(start, i + 1);
      return slice.reduce((a, x) => a + x[key], 0) / slice.length;
    });
  }

  function linearForecast(arr, key, horizon) {
    const n = arr.length;
    if (n < 3) return [];
    const xs = arr.map((_, i) => i);
    const ys = arr.map(a => a[key]);
    const xMean = xs.reduce((a, b) => a + b, 0) / n;
    const yMean = ys.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (ys[i] - yMean); den += (xs[i] - xMean) ** 2; }
    const slope = den ? num / den : 0;
    const intercept = yMean - slope * xMean;
    const residuals = ys.map((y, i) => y - (slope * xs[i] + intercept));
    const rmse = Math.sqrt(residuals.reduce((a, r) => a + r * r, 0) / n);
    const out = [];
    for (let h = 1; h <= horizon; h++) {
      const x = n - 1 + h;
      const yhat = slope * x + intercept;
      out.push({ idx: x, value: Math.max(0, yhat), lo: Math.max(0, yhat - 1.28 * rmse), hi: yhat + 1.28 * rmse });
    }
    return out;
  }

  window.__DashboardCore = {
    State, $, $$, fmtUSD, fmtNum, fmtPct, MONTH_NAMES,
    applyFilters, getFilteredRows, dimFilteredRows,
    computeKPIs, buildTrendSeries, movingAverage, linearForecast,
  };
})();
</script>

    if (!charts[id]) {

      if (!el) return null;
      charts[id] = echarts.default ? echarts.default.init(el) : echarts.init(el);
    }
    return charts[id];
  }
  function disposeChart(id) {
    if (charts[id]) { charts[id].dispose(); delete charts[id]; }
  }
  window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));

  function themeVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  // ---------------- App shell HTML ----------------
  function renderShell() {
    const app = $('#app');
    app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">ID</div>
          <div class="brand-text"><b>Import Ledger<span style="color:var(--accent-2)">✦</span></b><span>China → Indonesia Trade Intelligence</span></div>
        </div>
        <div class="status-pill" id="dataStatusPill"><span class="status-dot live"></span><span class="txt">Data BPS · Impor dari China</span></div>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

      </div>

      <div class="filterbar" id="filterBar"></div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="overview">Ringkasan</button>
        <button class="tab" data-tab="trend">Tren &amp; Forecast</button>
        <button class="tab" data-tab="geo">Peta Pelabuhan</button>
        <button class="tab" data-tab="product">HS Code</button>
        <button class="tab" data-tab="port">Pelabuhan</button>
        <button class="tab" data-tab="table">Tabel Detail</button>
      </div>

      <div id="tabContent"></div>

      <div class="footer">
        <span>Data riil impor Indonesia dari China per kode HS 2 digit, diproses dari berkas BPS WebAPI yang diunggah.</span>
        <span id="lastUpdated"></span>
      </div>
    `;

    $('#themeToggle').onclick = toggleTheme;
    $('#exportCsvBtn').onclick = () => window.exportCsv();
    $('#printBtn').onclick = () => window.print();
    $('#globalSearch').oninput = debounce((e) => {
      State.filters.search = e.target.value;
      refreshAll();
    }, 250);
    $$('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
  }

  function toggleTheme() {
    State.theme = State.theme === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', State.theme);
    $('#themeToggle').textContent = State.theme === 'dark' ? '☀️' : '🌙';
    Object.keys(charts).forEach(id => { disposeChart(id); });
    renderActiveTab();
  }

  function debounce(fn, ms) {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  function setTab(tab) {
    State.activeTab = tab;
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderActiveTab();
  }

  // ---------------- Filter bar ----------------
  function uniqueSorted(arr) { return Array.from(new Set(arr)).sort(); }

  function renderFilterBar() {
    const rows = State.allRows;
    const years = uniqueSorted(rows.map(r => r.year));
    const ports = uniqueSorted(rows.map(r => r.port));
    const hsCodes = uniqueSorted(rows.map(r => r.hsCode + ' — ' + r.hsDesc), (a,b)=>a.localeCompare(b));
    hsCodes.sort((a, b) => Number(a.split(' — ')[0]) - Number(b.split(' — ')[0]));
    const f = State.filters;

    const opt = (val, label, sel) => `<option value="${val}" ${sel ? 'selected' : ''}>${label}</option>`;

    const bar = $('#filterBar');
    bar.innerHTML = `
      <span class="flabel">Periode</span>
      <select id="fYearFrom">${years.map(y => opt(y, y, y === f.yearFrom)).join('')}</select>
      <span style="color:var(--text-faint)">–</span>
      <select id="fYearTo">${years.map(y => opt(y, y, y === f.yearTo)).join('')}</select>

      <select id="fMonth">${opt('all', 'Semua Bulan', f.month === 'all')}${MONTH_NAMES.map((m, i) => opt(i + 1, m, String(f.month) === String(i + 1))).join('')}</select>

      <span class="flabel">Pelabuhan</span>
      <select id="fPort">${opt('all', 'Semua Pelabuhan', f.port === 'all')}${ports.map(p => opt(p, p, p === f.port)).join('')}</select>

      <span class="flabel">HS Code</span>
      <select id="fHsCode">${opt('all', 'Semua HS Code', f.hsCode === 'all')}${hsCodes.map(h => { const code = h.split(' — ')[0]; return opt(code, h.length > 60 ? h.slice(0,57)+'…' : h, code === f.hsCode); }).join('')}</select>

      <button class="reset-link" id="resetFilters">Reset semua filter</button>
    `;

    $('#fYearFrom').onchange = e => { State.filters.yearFrom = Number(e.target.value); refreshAll(); };
    $('#fYearTo').onchange = e => { State.filters.yearTo = Number(e.target.value); refreshAll(); };
    $('#fQuarter').onchange = e => { State.filters.quarter = e.target.value; refreshAll(); };
    $('#fMonth').onchange = e => { State.filters.month = e.target.value; refreshAll(); };
    $('#fPort').onchange = e => { State.filters.port = e.target.value; refreshAll(); };
    $('#fHsCode').onchange = e => { State.filters.hsCode = e.target.value; refreshAll(); };
    $('#resetFilters').onclick = () => {
      const latestY = Math.max(...years);
      State.filters = { yearFrom: Math.min(...years), yearTo: latestY, month: 'all', quarter: 'all', port: 'all', hsCode: 'all', search: '' };
      $('#globalSearch').value = '';
      renderFilterBar();
      refreshAll();
    };
  }

  function refreshAll() {
    renderFilterBar();
    renderActiveTab();
  }

  function renderActiveTab() {
    // Every tab renderer overwrites #tabContent.innerHTML, which detaches the
    // old chart <div>s from the DOM. The echarts instance cache in `charts`
    // is keyed by id and survives that (it's a plain JS object), so on the
    // next render getChart(id) would see a stale truthy entry pointing at a
    // dead node and skip creating a fresh one -> chart silently fails to
    // (re)draw. This fires both on tab switch AND on any filter change
    // (refreshAll -> renderActiveTab), so disposal must live here, not just
    // in setTab.
    Object.keys(charts).forEach(id => disposeChart(id));
    const tab = State.activeTab;
    if (window.__Tabs[tab]) window.__Tabs[tab]();
  }
  window.renderActiveTab = renderActiveTab;

  window.__UI = { renderShell, renderFilterBar, refreshAll, getChart, disposeChart, themeVar, setTab };
})();

<script>
// ============================================================
// TAB RENDERERS — SHARED HELPERS + OVERVIEW

(function () {
  'use strict';
  const C = window.__DashboardCore;

  const PALETTE = ['#2547E0', '#6FA3EE', '#F5A524', '#F0654B', '#9B7EDE', '#2FBF8F', '#E4789A', '#4CC3E0', '#F0965A', '#8AC24A', '#8892B0', '#E8746A'];

  function aggBy(rows, keyFn) {
    const map = new Map();
    rows.forEach(r => {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, valueUSD: 0, count: 0 });
      const e = map.get(k);
      e.valueUSD += r.valueUSD; e.count++;
    });
    return Array.from(map.values());
  }

  function baseAxisTheme() {
    const dim = UI.themeVar('--text-faint');
    const border = UI.themeVar('--border-soft');
    return {
      axisLine: { lineStyle: { color: border } },
      axisLabel: { color: dim, fontFamily: 'Poppins', fontSize: 10.5 },
      splitLine: { lineStyle: { color: border, type: 'dashed' } },
    };
  }

  function tooltipTheme() {
    return {
      backgroundColor: UI.themeVar('--panel'),
      borderColor: UI.themeVar('--border'),
      textStyle: { color: UI.themeVar('--text'), fontSize: 12 },
      extraCssText: 'border-radius:12px; box-shadow:0 8px 24px -8px rgba(28,35,64,0.25);',
    };
  }

  // ================= INSIGHTS =================
  function generateInsights() {
    const rows = C.getFilteredRows();
    const insights = [];
    const kpi = C.computeKPIs();

    if (kpi.mom != null) {
      insights.push({
        color: kpi.mom >= 0 ? 'var(--mint)' : 'var(--coral)',
        html: `Impor dari China ${kpi.mom >= 0 ? 'naik' : 'turun'} <b>${fmtPct(Math.abs(kpi.mom))}</b> dibanding bulan sebelumnya (per ${kpi.lastPeriodLabel}).`,
      });
    }
    if (kpi.yoy != null) {
      insights.push({
        color: kpi.yoy >= 0 ? 'var(--mint)' : 'var(--coral)',
        html: `Secara tahunan (YoY), impor ${kpi.yoy >= 0 ? 'tumbuh' : 'menyusut'} <b>${fmtPct(Math.abs(kpi.yoy))}</b> dibanding periode yang sama tahun lalu.`,
      });
    }
    const byHs = aggBy(rows, r => r.hsCode + ' — ' + r.hsDesc).sort((a, b) => b.valueUSD - a.valueUSD);
    if (byHs.length) {
      const top = byHs[0];
      const total = rows.reduce((a, r) => a + r.valueUSD, 0);
      const share = (top.valueUSD / total * 100) || 0;
      const label = top.key.length > 70 ? top.key.slice(0, 67) + '…' : top.key;
      insights.push({ color: 'var(--accent-2)', html: `<b>HS ${label}</b> adalah kelompok kode HS dengan nilai impor terbesar, dengan pangsa <b>${share.toFixed(1)}%</b> dari total pada periode terpilih.` });
    }
    const byPort = aggBy(rows, r => r.port).sort((a, b) => b.valueUSD - a.valueUSD);
    if (byPort.length) insights.push({ color: 'var(--violet)', html: `<b>${byPort[0].key}</b> menangani nilai impor terbesar di antara pelabuhan yang tercatat pada periode ini.` });

    const years = Array.from(new Set(rows.map(r => r.year))).sort((a, b) => a - b);
    if (years.length >= 2) {
      const y0 = years[years.length - 2], y1 = years[years.length - 1];
      const byHsGrowth = aggBy(rows.filter(r => r.year === y0 || r.year === y1), r => r.hsCode).map(h => {
        const v0 = rows.filter(r => r.hsCode === h.key && r.year === y0).reduce((a, r) => a + r.valueUSD, 0);
        const v1 = rows.filter(r => r.hsCode === h.key && r.year === y1).reduce((a, r) => a + r.valueUSD, 0);
        const g = v0 > 0 ? ((v1 - v0) / v0) * 100 : null;
        return { hs: h.key, g, v1 };
      }).filter(x => x.g != null && x.v1 > 1e6);
      byHsGrowth.sort((a, b) => b.g - a.g);
      if (byHsGrowth[0]) {
        const desc = rows.find(r => r.hsCode === byHsGrowth[0].hs)?.hsDesc || '';
        insights.push({ color: 'var(--amber)', html: `Kode HS <b>${byHsGrowth[0].hs}</b> (${desc.split(';')[0]}) tumbuh tercepat (${fmtPct(byHsGrowth[0].g, true)}) dari ${y0} ke ${y1}.` });
      }
    }

    return insights.slice(0, 6);
  }

  function renderInsightPanel(targetSel) {
    const insights = generateInsights();
    const el = $(targetSel);
    el.innerHTML = insights.map(i => `<div class="insight-item"><span class="dot" style="background:${i.color}"></span><span>${i.html}</span></div>`).join('')
      || '<div class="insight-item">Tidak ada insight untuk kombinasi filter ini.</div>';
  }

  // ================= KPI GRID =================
  function kpiTile(label, value, accentVar, sub) {
    return `<div class="kpi" style="--kpi-accent:${accentVar}">
      <div class="lbl">${label}</div>
      <div class="val">${value}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
    </div>`;
  }

  function renderKpiGrid(targetSel) {
    const k = C.computeKPIs();
    const momArrow = k.mom == null ? '' : (k.mom >= 0 ? `<span class="up">▲ ${fmtPct(Math.abs(k.mom))}</span>` : `<span class="down">▼ ${fmtPct(Math.abs(k.mom))}</span>`);
    const yoyArrow = k.yoy == null ? '' : (k.yoy >= 0 ? `<span class="up">▲ ${fmtPct(Math.abs(k.yoy))}</span>` : `<span class="down">▼ ${fmtPct(Math.abs(k.yoy))}</span>`);
    const html = [
      kpiTile('Total Nilai Impor', fmtUSD(k.totalValue, true), 'var(--accent)', `${fmtUSD(k.totalValue)} pada periode terpilih`),
      kpiTile('HS Code Aktif', k.hsCodes, 'var(--accent-2)', 'dari 98 kode HS 2-digit'),
      kpiTile('Pelabuhan Aktif', k.ports, 'var(--violet)', 'dari 5 pelabuhan utama'),
      kpiTile('MoM Growth', momArrow || '—', k.mom >= 0 ? 'var(--mint)' : 'var(--coral)', `vs bulan sebelum ${k.lastPeriodLabel}`),
      kpiTile('YoY Growth', yoyArrow || '—', k.yoy >= 0 ? 'var(--mint)' : 'var(--coral)', `vs tahun lalu`),
      kpiTile('CAGR (periode terpilih)', k.cagr == null ? '—' : fmtPct(k.cagr, true), 'var(--amber)'),
      kpiTile('Avg Monthly Import', fmtUSD(k.avgMonthly, true), 'var(--accent)'),
    ].join('');
    $(targetSel).innerHTML = html;
  }

  // ================= TREND CHART =================
  function renderTrendChart(elId, opts) {
    opts = opts || {};
    const granularity = opts.granularity || State.trendGranularity;
    const series = C.buildTrendSeries(granularity);
    const showMA = opts.showMA ?? State.showMA;
    const showForecast = opts.showForecast ?? State.showForecast;
    const maWindow = granularity === 'monthly' ? 3 : granularity === 'quarterly' ? 2 : 1;
    const ma = showMA ? C.movingAverage(series, 'value', maWindow) : [];
    const forecast = showForecast ? C.linearForecast(series, 'value', State.forecastHorizon) : [];

    const categories = series.map(s => s.key).concat(forecast.map((f, i) => {
      const lastKey = series[series.length - 1].key;
      return granularity === 'yearly' ? String(Number(lastKey) + i + 1)
        : granularity === 'quarterly' ? `F+${i + 1}`
        : `F+${i + 1}`;
    }));

    const valueSeriesData = series.map(s => s.value).concat(forecast.map(() => null));
    const forecastData = new Array(series.length - 1).fill(null).concat([series[series.length - 1].value]).concat(forecast.map(f => f.value));
    const forecastBand = new Array(series.length).fill(null).concat(forecast.map(f => [f.lo, f.hi]));
    const maData = ma.concat(forecast.map(() => null));

    const chart = UI.getChart(elId);
    if (!chart) return;
    const axisTheme = baseAxisTheme();

    const opt = {
      backgroundColor: 'transparent',
      grid: { left: 56, right: 20, top: 30, bottom: 40 },
      tooltip: { trigger: 'axis', ...tooltipTheme(), valueFormatter: v => typeof v === 'number' ? fmtUSD(v, true) : v },
      legend: { data: ['Import Value', showMA ? `MA(${maWindow})` : null, showForecast ? 'Forecast' : null].filter(Boolean), textStyle: { color: UI.themeVar('--text-dim'), fontSize: 11 }, top: 0 },
      xAxis: { type: 'category', data: categories, ...axisTheme, axisLabel: { ...axisTheme.axisLabel, rotate: granularity === 'monthly' ? 55 : 0, interval: granularity === 'monthly' ? Math.ceil(categories.length / 24) : 0 } },
      yAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => fmtUSD(v, true) } },
      series: [
        { name: 'Import Value', type: 'bar', data: valueSeriesData, itemStyle: { color: '#2547E0', borderRadius: [6, 6, 0, 0] }, barMaxWidth: 18 },
        showMA ? { name: `MA(${maWindow})`, type: 'line', data: maData, smooth: true, showSymbol: false, lineStyle: { color: '#F5A524', width: 2 } } : null,
        showForecast ? { name: 'Forecast', type: 'line', data: forecastData, showSymbol: true, symbolSize: 5, lineStyle: { color: '#F0654B', width: 2, type: 'dashed' }, itemStyle: { color: '#F0654B' } } : null,
        showForecast ? { name: 'CI lo', type: 'line', data: forecastBand.map(v => v ? v[0] : null), lineStyle: { opacity: 0 }, stack: 'band', symbol: 'none', silent: true, tooltip: { show: false } } : null,
        showForecast ? { name: 'CI range', type: 'line', data: forecastBand.map(v => v ? (v[1] - v[0]) : null), lineStyle: { opacity: 0 }, areaStyle: { color: 'rgba(240,101,75,0.14)' }, stack: 'band', symbol: 'none', silent: true, tooltip: { show: false } } : null,
      ].filter(Boolean),
    };
    chart.setOption(opt, true);
  }

  window.__Tabs = window.__Tabs || {};
  window.__Tabs._shared = { PALETTE, aggBy, baseAxisTheme, tooltipTheme, generateInsights, renderInsightPanel, renderKpiGrid, renderTrendChart };
})();
(function () {
  'use strict';
  const C = window.__DashboardCore;

  function renderOverview() {

  function renderHBarChart(elId, data, topN, color) {

      xAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => fmtUSD(v, true) } },
      yAxis: { type: 'category', data: sorted.map(d => d.key).reverse(), ...axisTheme, axisLine: { show: false } },
      series: [{ type: 'bar', data: sorted.map(d => d.valueUSD).reverse(), itemStyle: { color: color || '#2547E0', borderRadius: [0, 8, 8, 0] }, barMaxWidth: 16 }],
    }, true);
    chart.off('click'); chart.on('click', (p) => {
      const field = elId.includes('hs') ? 'hsCode' : elId.includes('port') ? 'port' : null;
      if (field) { State.filters[field] = p.name; UI.refreshAll(); }
    });
  }

  function renderDonutChart(elId, data) {
    const sorted = data.sort((a, b) => b.valueUSD - a.valueUSD);
    const chart = UI.getChart(elId);
    if (!chart) return;
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: { trigger: 'item', ...S.tooltipTheme(), valueFormatter: v => fmtUSD(v, true) },
      legend: { show: false },
      series: [{
        type: 'pie', radius: ['46%', '76%'], center: ['50%', '50%'],
        data: sorted.map((d, i) => ({ name: d.key, value: d.valueUSD, itemStyle: { color: S.PALETTE[i % S.PALETTE.length] } })),
        label: { color: UI.themeVar('--text-dim'), fontSize: 10.5, formatter: '{b}\n{d}%' },
        labelLine: { lineStyle: { color: UI.themeVar('--border') } },
        emphasis: { scale: true },
      }],
    }, true);
    chart.off('click'); chart.on('click', (p) => { State.filters.port = p.name; UI.refreshAll(); });
  }

  window.__Tabs.overview = renderOverview;
  window.__Tabs._shared.renderHBarChart = renderHBarChart;
  window.__Tabs._shared.renderDonutChart = renderDonutChart;
})();

        <div class="card">
          <div class="card-head"><div class="card-title">Growth YoY per Bulan</div></div>
          <div class="chart-box h-260" id="tr_yoy"></div>
        </div>
      </div>
    `;
    const rerender = () => {
      S.renderTrendChart('tr_main', { granularity: State.trendGranularity, showMA: State.showMA, showForecast: State.showForecast });
    };
    $$('#granSeg button').forEach(b => b.onclick = () => {
      $$('#granSeg button').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); State.trendGranularity = b.dataset.g; rerender();
    });
    $('#maToggle').onchange = e => { State.showMA = e.target.checked; rerender(); };
    $('#fcToggle').onchange = e => { State.showForecast = e.target.checked; $('#fcHorizon').classList.toggle('hidden', !e.target.checked); rerender(); };
    $('#fcHorizon').onchange = e => { State.forecastHorizon = Number(e.target.value); rerender(); };
    rerender();
    renderGrowthBars('tr_mom', 'mom');
    renderGrowthBars('tr_yoy', 'yoy');
  }

  function renderGrowthBars(elId, mode) {
    const series = C.buildTrendSeries('monthly');
    const growth = series.map((s, i) => {
      let ref;
      if (mode === 'mom') ref = series[i - 1];
      else ref = series.find(x => x.key === String(Number(s.key.slice(0, 4)) - 1) + s.key.slice(4));
      const g = ref && ref.value ? ((s.value - ref.value) / ref.value) * 100 : null;
      return { key: s.key, g };
    }).filter(x => x.g != null);
    const chart = UI.getChart(elId);
    if (!chart) return;
    const axisTheme = S.baseAxisTheme();
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 50, right: 20, top: 10, bottom: 55 },
      tooltip: { trigger: 'axis', ...S.tooltipTheme(), valueFormatter: v => fmtPct(v, true) },
      xAxis: { type: 'category', data: growth.map(g => g.key), ...axisTheme, axisLabel: { ...axisTheme.axisLabel, rotate: 55, interval: Math.ceil(growth.length / 20) } },
      yAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => v + '%' } },
      series: [{ type: 'bar', data: growth.map(g => ({ value: g.g, itemStyle: { color: g.g >= 0 ? '#2FBF8F' : '#F0654B' } })), barMaxWidth: 10 }],
    }, true);
  }

  // ================= PORT MAP TAB =================
  let geoJsonLoaded = false;
  const GEOJSON_URLS = [
    'https://cdn.jsdelivr.net/gh/denyherianto/indonesia-geojson-topojson-maps-with-38-provinces@main/GeoJSON/indonesia-38-provinces.geojson',
    'https://cdn.jsdelivr.net/gh/superpikar/indonesia-geojson@master/indonesia-province-simple.json',
  ];

  async function ensureGeoJson() {
    if (geoJsonLoaded) return true;
    for (const url of GEOJSON_URLS) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const geo = await res.json();
        (echarts.default || echarts).registerMap('IDN', geo);
        geoJsonLoaded = true;
        return true;
      } catch (e) { /* try next */ }
    }
    return false;
  }

  async function renderGeoTab() {
    $('#tabContent').innerHTML = `
      <div class="grid cols-2">
        <div class="card">
          <div class="card-head">
            <div><div class="card-title">🗺️ Peta Provinsi Pelabuhan Masuk</div><div class="card-sub">Nilai impor dari China berdasarkan provinsi pelabuhan masuk. Hover untuk detail, klik untuk drill-down.</div></div>
            <div class="map-legend">Rendah <div class="legend-scale"></div> Tinggi</div>
          </div>
          <div class="chart-box h-520" id="geo_map"><div class="skel" style="height:100%"></div></div>
        </div>
        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">Ranking Pelabuhan</div></div>
            <div class="chart-box h-260" id="geo_portbar"></div>
          </div>
          <div class="card">
            <div class="card-head"><div class="card-title">Treemap Pelabuhan × Kode HS</div></div>
            <div class="chart-box h-260" id="geo_treemap"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Ranking Pelabuhan — Detail</div></div>
        <div class="table-wrap"><table id="geo_table"><thead><tr><th>#</th><th>Pelabuhan</th><th>Provinsi</th><th>Nilai Impor</th><th>Share %</th></tr></thead><tbody></tbody></table></div>
      </div>
    `;
    S.renderHBarChart('geo_portbar', S.aggBy(C.getFilteredRows(), r => r.port), 5, '#6FA3EE');
    renderTreemap('geo_treemap');
    renderPortTable();
    const ok = await ensureGeoJson();
    if (ok) renderMap(); else {
      $('#geo_map').innerHTML = `<div class="unavail" style="height:100%; display:flex; flex-direction:column; justify-content:center;"><b>Peta tidak dapat dimuat</b>Gagal mengambil berkas GeoJSON batas provinsi dari CDN (mungkin masalah jaringan/CORS). Chart lain di halaman ini tetap berfungsi normal.</div>`;
    }
  }

  function renderTreemap(elId) {
    const rows = C.getFilteredRows();
    const byPort = {};
    rows.forEach(r => {
      byPort[r.port] = byPort[r.port] || {};
      const label = `HS ${r.hsCode}`;
      byPort[r.port][label] = (byPort[r.port][label] || 0) + r.valueUSD;
    });
    const topPorts = Object.entries(byPort).map(([k, v]) => [k, Object.values(v).reduce((a, b) => a + b, 0)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const data = topPorts.map((port, i) => ({
      name: port,
      itemStyle: { color: S.PALETTE[i % S.PALETTE.length] },
      children: Object.entries(byPort[port]).sort((a,b) => b[1]-a[1]).slice(0, 10).map(([hs, val]) => ({ name: hs, value: val })),
    }));
    const chart = UI.getChart(elId);
    if (!chart) return;
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: { ...S.tooltipTheme(), formatter: p => `${p.name}<br/>${fmtUSD(p.value, true)}` },
      series: [{ type: 'treemap', data, roam: false, breadcrumb: { show: false }, label: { color: '#fff', fontSize: 10.5, fontWeight: 600 }, upperLabel: { show: true, height: 20, color: '#fff' } }],
    }, true);
  }

  function renderPortTable() {
    const rows = C.getFilteredRows();
    const total = rows.reduce((a, r) => a + r.valueUSD, 0);
    const data = S.aggBy(rows, r => r.port).sort((a, b) => b.valueUSD - a.valueUSD);
    const provMap = {}; rows.forEach(r => provMap[r.port] = r.province);
    const tbody = $('#geo_table tbody');
    tbody.innerHTML = data.map((d, i) => `
      <tr onclick="__DashboardCore.State.filters.port='${d.key}'; __UI.refreshAll();">
        <td>${i + 1}</td><td class="txt">${d.key}</td><td class="txt">${provMap[d.key] || ''}</td><td>${fmtUSD(d.valueUSD, true)}</td>
        <td>${((d.valueUSD / total) * 100).toFixed(1)}%</td>
      </tr>`).join('');
  }

  // Precise lon/lat of each port, since the province choropleth alone only
  // shades a whole province and gives no exact pin for where the port sits.
  const PORT_COORDS = {
    'Tanjung Priok': [106.8650, -6.1045],
    'Tanjung Perak': [112.7297, -7.1978],
    'Tanjung Emas':  [110.4203, -6.9385],
    'Belawan':       [98.6767, 3.7833],
    'Merak':         [105.9930, -5.9330],
  };

  function renderMap() {
    const rows = C.getFilteredRows();
    const byProvince = S.aggBy(rows, r => r.province).sort((a, b) => b.valueUSD - a.valueUSD);
    const byPort = S.aggBy(rows, r => r.port).sort((a, b) => b.valueUSD - a.valueUSD);
    const chart = UI.getChart('geo_map');
    if (!chart) return;
    const maxVal = Math.max(...byProvince.map(p => p.valueUSD), 1);
    const mapData = byProvince.map(p => ({ name: p.key, value: p.valueUSD, extra: p }));

    const maxPortVal = Math.max(...byPort.map(p => p.valueUSD), 1);
    const portPoints = byPort
      .filter(p => PORT_COORDS[p.key])
      .map(p => ({
        name: p.key,
        value: [...PORT_COORDS[p.key], p.valueUSD],
        extra: p,
      }));

    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        ...S.tooltipTheme(),
        formatter: (p) => {
          if (p.seriesType === 'effectScatter') {
            const d = p.data.extra;
            return `<b>⚓ ${p.name}</b><br/>Total Import: ${fmtUSD(d.valueUSD, true)}`;
          }
          if (!p.data) return `${p.name}<br/><span style="color:var(--text-faint)">Tidak ada data impor tercatat</span>`;
          const d = p.data.extra;
          return `<b>${p.name}</b><br/>Total Import: ${fmtUSD(d.valueUSD, true)}`;
        },
      },
      visualMap: {
        min: 0, max: maxVal, calculable: true, orient: 'horizontal', left: 'center', bottom: 6,
        textStyle: { color: UI.themeVar('--text-faint'), fontSize: 10 },
        inRange: { color: ['#F3EEE0', '#6FA3EE', '#2547E0'] },
        seriesIndex: [0], // only color-scale the choropleth (series 0), not the port dots
      },
      // Explicit geo component = the shared coordinate system. The map
      // series below points at it via geoIndex (officially supported since
      // ECharts v4 — "a geo coordinate system can be shared among map series
      // and other series, like scatter series", see series-map.geoIndex),
      // so the choropleth and the port dots stay perfectly aligned and pan/
      // zoom together.
      geo: {
        map: 'IDN', roam: true, scaleLimit: { min: 1, max: 8 },
        label: { show: false },
        itemStyle: { borderColor: UI.themeVar('--border'), borderWidth: 0.6, areaColor: UI.themeVar('--panel-2') },
        emphasis: { label: { show: false }, itemStyle: { areaColor: UI.themeVar('--panel-2') } },
      },
      series: [
        {
          name: 'Provinsi', type: 'map', map: 'IDN', geoIndex: 0,
          label: { show: false },
          emphasis: { label: { show: true, color: '#fff' }, itemStyle: { areaColor: '#F5A524' } },
          data: mapData,
        },
        {
          name: 'Pelabuhan', type: 'effectScatter', coordinateSystem: 'geo', geoIndex: 0,
          data: portPoints,
          symbolSize: (val) => 8 + (val[2] / maxPortVal) * 22,
          rippleEffect: { brushType: 'stroke', scale: 3 },
          showEffectOn: 'render',
          itemStyle: { color: '#F5A524', shadowBlur: 6, shadowColor: 'rgba(245,165,36,0.5)' },
          label: {
            show: true, formatter: '{b}', position: 'right',
            color: UI.themeVar('--text'), fontSize: 10.5, fontWeight: 600,
            textBorderColor: UI.themeVar('--panel'), textBorderWidth: 3,
          },
          zlevel: 2,
        },
      ],
    }, true);
    chart.off('click'); chart.on('click', (p) => {
      if (p.componentSubType === 'effectScatter') {
        State.filters.port = p.name; UI.refreshAll(); return;
      }
      if (!p.data) return;
      const matchPort = C.State.allRows.find(r => r.province === p.name);
      if (matchPort) { State.filters.port = matchPort.port; UI.refreshAll(); }
    });
  }

  window.__Tabs.trend = renderTrendTab;
  window.__Tabs.geo = renderGeoTab;
})();
</script>
<script>
(function () {
  'use strict';
  const C = window.__DashboardCore;
  const UI = window.__UI;
  const S = window.__Tabs._shared;
  const { State, $, $$, fmtUSD, fmtNum, fmtPct, MONTH_NAMES } = C;

  // ================= HS CODE TAB =================
  function renderProductTab() {
    $('#tabContent').innerHTML = `
      <div class="grid cols-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Top 15 Kode HS</div><div class="card-sub">Klik batang untuk memfilter seluruh dashboard</div></div>
          <div class="chart-box h-380" id="pr_hsbar"></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Kode HS — Treemap</div></div>
          <div class="chart-box h-380" id="pr_cattreemap"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Detail Kode HS (2 Digit)</div></div>
        <div class="table-wrap"><table id="pr_hstable"><thead><tr><th>#</th><th>HS Code</th><th>Deskripsi</th><th>Nilai Impor</th><th>Share %</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Top 8 Kode HS — Stacked Bar per Tahun</div></div>
        <div class="chart-box h-380" id="pr_stacked"></div>
      </div>
    `;
    renderHsBar();
    renderCategoryTreemap();
    renderHsTable();
    renderCategoryStacked();
  }

  function renderHsBar() {
    const rows = C.getFilteredRows();
    const byHs = S.aggBy(rows, r => r.hsCode).sort((a, b) => b.valueUSD - a.valueUSD).slice(0, 15);
    const chart = UI.getChart('pr_hsbar');
    if (!chart) return;
    const axisTheme = S.baseAxisTheme();
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 50, right: 30, top: 10, bottom: 10 },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, ...S.tooltipTheme(), valueFormatter: v => fmtUSD(v, true) },
      xAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => fmtUSD(v, true) } },
      yAxis: { type: 'category', data: byHs.map(d => d.key).reverse(), ...axisTheme, axisLine: { show: false } },
      series: [{ type: 'bar', data: byHs.map(d => d.valueUSD).reverse(), itemStyle: { color: '#6FA3EE', borderRadius: [0, 8, 8, 0] }, barMaxWidth: 14 }],
    }, true);
    chart.off('click'); chart.on('click', (p) => { State.filters.hsCode = p.name; UI.refreshAll(); });
  }

  function renderCategoryTreemap() {
    const rows = C.getFilteredRows();
    const byHs = S.aggBy(rows, r => r.hsCode).sort((a, b) => b.valueUSD - a.valueUSD).slice(0, 24);
    const chart = UI.getChart('pr_cattreemap');
    if (!chart) return;
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: { ...S.tooltipTheme(), formatter: p => `HS ${p.name}<br/>${fmtUSD(p.value, true)}` },
      series: [{
        type: 'treemap',
        data: byHs.map((d, i) => ({ name: d.key, value: d.valueUSD, itemStyle: { color: S.PALETTE[i % S.PALETTE.length] } })),
        roam: false, breadcrumb: { show: false },
        label: { color: '#fff', fontWeight: 600, fontSize: 11.5 },
      }],
    }, true);
    chart.off('click'); chart.on('click', (p) => { State.filters.hsCode = p.name; UI.refreshAll(); });
  }

  function renderHsTable() {
    const rows = C.getFilteredRows();
    const total = rows.reduce((a, r) => a + r.valueUSD, 0);
    const data = S.aggBy(rows, r => r.hsCode).sort((a, b) => b.valueUSD - a.valueUSD);
    const meta = {};
    rows.forEach(r => { meta[r.hsCode] = r.hsDesc; });
    $('#pr_hstable tbody').innerHTML = data.map((d, i) => `
      <tr onclick="__DashboardCore.State.filters.hsCode='${d.key}'; __UI.refreshAll();">
        <td>${i + 1}</td><td>${d.key}</td><td class="txt">${meta[d.key] || ''}</td>
        <td>${fmtUSD(d.valueUSD, true)}</td><td>${((d.valueUSD / total) * 100).toFixed(1)}%</td>
      </tr>`).join('');
  }

  function renderCategoryStacked() {
    const rows = C.getFilteredRows();
    const years = Array.from(new Set(rows.map(r => r.year))).sort();
    const topHs = S.aggBy(rows, r => r.hsCode).sort((a, b) => b.valueUSD - a.valueUSD).slice(0, 8).map(d => d.key);
    const chart = UI.getChart('pr_stacked');
    if (!chart) return;
    const axisTheme = S.baseAxisTheme();
    const seriesData = topHs.map((hs, i) => ({
      name: 'HS ' + hs, type: 'bar', stack: 'total',
      itemStyle: { color: S.PALETTE[i % S.PALETTE.length] },
      data: years.map(y => rows.filter(r => r.year === y && r.hsCode === hs).reduce((a, r) => a + r.valueUSD, 0)),
    }));
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 60, right: 20, top: 10, bottom: 40 },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, ...S.tooltipTheme(), valueFormatter: v => fmtUSD(v, true) },
      legend: { data: topHs.map(h => 'HS ' + h), textStyle: { color: UI.themeVar('--text-dim'), fontSize: 10 }, top: 0, type: 'scroll' },
      xAxis: { type: 'category', data: years, ...axisTheme },
      yAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => fmtUSD(v, true) } },
      series: seriesData,
    }, true);
  }

  // ================= PORT TAB =================
  function renderPortTab() {
    $('#tabContent').innerHTML = `
      <div class="grid cols-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Pelabuhan — Nilai Impor</div></div>
          <div class="chart-box h-380" id="pt_bar"></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Tren Bulanan per Pelabuhan</div></div>
          <div class="chart-box h-380" id="pt_trend"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Ranking Pelabuhan — Detail</div></div>
        <div class="table-wrap"><table id="pt_table"><thead><tr><th>#</th><th>Pelabuhan</th><th>Provinsi</th><th>Nilai Impor</th><th>Growth YoY</th></tr></thead><tbody></tbody></table></div>
      </div>
    `;
    S.renderHBarChart('pt_bar', S.aggBy(C.getFilteredRows(), r => r.port), 5, '#9B7EDE');
    renderPortTrend();
    renderPortTable();
  }

  function renderPortTrend() {
    const rows = C.getFilteredRows();
    const topPorts = S.aggBy(rows, r => r.port).sort((a, b) => b.valueUSD - a.valueUSD).map(p => p.key);
    const months = Array.from(new Set(rows.map(r => `${r.year}-${String(r.month).padStart(2, '0')}`))).sort();
    const chart = UI.getChart('pt_trend');
    if (!chart) return;
    const axisTheme = S.baseAxisTheme();
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 60, right: 20, top: 10, bottom: 50 },
      tooltip: { trigger: 'axis', ...S.tooltipTheme(), valueFormatter: v => fmtUSD(v, true) },
      legend: { data: topPorts, textStyle: { color: UI.themeVar('--text-dim'), fontSize: 10 }, top: 0, type: 'scroll' },
      xAxis: { type: 'category', data: months, ...axisTheme, axisLabel: { ...axisTheme.axisLabel, rotate: 55, interval: Math.ceil(months.length / 18) } },
      yAxis: { type: 'value', ...axisTheme, axisLabel: { ...axisTheme.axisLabel, formatter: v => fmtUSD(v, true) } },
      series: topPorts.map((port, i) => ({
        name: port, type: 'line', smooth: true, showSymbol: false,
        lineStyle: { color: S.PALETTE[i % S.PALETTE.length], width: 2 },
        data: months.map(m => { const [y, mo] = m.split('-'); return rows.filter(r => r.port === port && r.year === Number(y) && r.month === Number(mo)).reduce((a, r) => a + r.valueUSD, 0); }),
      })),
    }, true);
  }

  function renderPortTable() {
    const rows = C.getFilteredRows();
    const data = S.aggBy(rows, r => r.port).sort((a, b) => b.valueUSD - a.valueUSD);
    const provMap = {}; rows.forEach(r => provMap[r.port] = r.province);
    const years = Array.from(new Set(rows.map(r => r.year))).sort();
    const y0 = years[years.length - 2], y1 = years[years.length - 1];
    $('#pt_table tbody').innerHTML = data.map((d, i) => {
      const v0 = rows.filter(r => r.port === d.key && r.year === y0).reduce((a, r) => a + r.valueUSD, 0);
      const v1 = rows.filter(r => r.port === d.key && r.year === y1).reduce((a, r) => a + r.valueUSD, 0);
      const g = v0 ? ((v1 - v0) / v0) * 100 : null;
      return `<tr onclick="__DashboardCore.State.filters.port='${d.key}'; __UI.refreshAll();">
        <td>${i + 1}</td><td class="txt">${d.key}</td><td class="txt">${provMap[d.key] || ''}</td>
        <td>${fmtUSD(d.valueUSD, true)}</td>
        <td>${g == null ? '—' : `<span class="${g >= 0 ? 'up' : 'down'}">${g >= 0 ? '▲' : '▼'} ${fmtPct(Math.abs(g))}</span>`}</td>
      </tr>`;
    }).join('');
  }

  // ================= DETAIL TABLE TAB =================
  function renderTableTab() {
    $('#tabContent').innerHTML = `
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Tabel Detail — Impor per HS Code, Pelabuhan, Bulan</div><div class="card-sub" id="tbl_count"></div></div>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="tbl_export">⇩ Export CSV</button>
          </div>
        </div>
        <div class="table-wrap"><table id="dt_table"><thead></thead><tbody></tbody></table></div>
        <div class="pagination" id="dt_pagination"></div>
      </div>
    `;
    $('#tbl_export').onclick = exportCsv;
    renderDetailTable();
  }

  const TABLE_COLS = [
    { key: 'year', label: 'Tahun' }, { key: 'month', label: 'Bulan', fmt: v => MONTH_NAMES[v - 1] },
    { key: 'hsCode', label: 'HS Code' }, { key: 'hsDesc', label: 'Deskripsi' },
    { key: 'port', label: 'Pelabuhan' }, { key: 'province', label: 'Provinsi' },
    { key: 'valueUSD', label: 'Nilai (USD)', fmt: v => fmtUSD(v) },
  ];

  function renderDetailTable() {
    const rows = C.getFilteredRows();
    $('#tbl_count').textContent = `${fmtNum(rows.length)} baris cocok dengan filter aktif`;
    const sort = State.tableSort;
    const sorted = [...rows].sort((a, b) => {
      const av = a[sort.key], bv = b[sort.key];
      if (typeof av === 'string') return sort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sort.dir === 'asc' ? av - bv : bv - av;
    });
    const pageSize = State.tablePageSize;
    const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
    State.tablePage = Math.min(State.tablePage, totalPages);
    const start = (State.tablePage - 1) * pageSize;
    const pageRows = sorted.slice(start, start + pageSize);

    $('#dt_table thead').innerHTML = `<tr>${TABLE_COLS.map(c => `<th data-key="${c.key}">${c.label}${sort.key === c.key ? `<span class="arrow">${sort.dir === 'asc' ? '↑' : '↓'}</span>` : ''}</th>`).join('')}</tr>`;
    $('#dt_table tbody').innerHTML = pageRows.map(r => `<tr>${TABLE_COLS.map(c => `<td class="${typeof r[c.key] === 'string' ? 'txt' : ''}">${c.fmt ? c.fmt(r[c.key]) : r[c.key]}</td>`).join('')}</tr>`).join('');
    $$('#dt_table thead th').forEach(th => th.onclick = () => {
      const k = th.dataset.key;
      if (sort.key === k) sort.dir = sort.dir === 'asc' ? 'desc' : 'asc'; else { sort.key = k; sort.dir = 'desc'; }
      renderDetailTable();
    });

    const pag = $('#dt_pagination');
    let pageBtns = '';
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - State.tablePage) <= 2) {
        pageBtns += `<button class="${p === State.tablePage ? 'active' : ''}" data-p="${p}">${p}</button>`;
      } else if (Math.abs(p - State.tablePage) === 3) pageBtns += `<span style="padding:0 4px;">…</span>`;
    }
    pag.innerHTML = `<span>Halaman ${State.tablePage} dari ${totalPages}</span><div class="pgbtns">
      <button id="dt_prev" ${State.tablePage === 1 ? 'disabled' : ''}>‹</button>${pageBtns}<button id="dt_next" ${State.tablePage === totalPages ? 'disabled' : ''}>›</button>
    </div>`;
    $$('#dt_pagination .pgbtns button[data-p]').forEach(b => b.onclick = () => { State.tablePage = Number(b.dataset.p); renderDetailTable(); });
    const prevBtn = $('#dt_prev'), nextBtn = $('#dt_next');
    if (prevBtn) prevBtn.onclick = () => { State.tablePage--; renderDetailTable(); };
    if (nextBtn) nextBtn.onclick = () => { State.tablePage++; renderDetailTable(); };
  }

  function exportCsv() {
    const rows = C.getFilteredRows();
    const header = TABLE_COLS.map(c => c.label).join(',');
    const lines = rows.map(r => TABLE_COLS.map(c => `"${r[c.key]}"`).join(','));
    const csv = [header, ...lines].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `import-hs-china-${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
  }
  window.exportCsv = exportCsv;

  window.__Tabs.product = renderProductTab;
  window.__Tabs.port = renderPortTab;
  window.__Tabs.table = renderTableTab;
})();

// ================= BOOTSTRAP =================
(function () {
  'use strict';
  const C = window.__DashboardCore;
  const UI = window.__UI;
  const { State } = C;

  function init() {
    const { rows, latestPeriod } = buildFactTable();
    State.allRows = rows;
    State.latestPeriod = latestPeriod;
    const years = Array.from(new Set(rows.map(r => r.year)));
    State.filters.yearFrom = Math.min(...years);
    State.filters.yearTo = Math.max(...years);

    UI.renderShell();
    UI.renderFilterBar();
    document.getElementById('lastUpdated').textContent = `Data s.d. ${C.MONTH_NAMES[latestPeriod.month - 1]} ${latestPeriod.year} · Dibuat ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    window.renderActiveTab();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
